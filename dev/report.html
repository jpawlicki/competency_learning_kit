<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competency Learning Kit - Progress Report</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
        }

        .header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 { font-size: 1.875rem; margin: 0; }
        p { color: var(--text-muted); margin: 4px 0 0 0; }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border);
            display: flex;
            gap: 40px;
        }

        .controls {
            flex: 0 0 300px;
        }

        .visualization {
            flex: 1;
            min-width: 0;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }

        button {
            appearance: none;
            background-color: var(--primary);
            color: white;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: left;
        }

        button:hover { opacity: 0.9; }
        button.secondary {
            background-color: white;
            color: var(--text);
            border-color: var(--border);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        canvas {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 100%;
            height: auto;
            aspect-ratio: 1;
        }

        .info-box {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-top: 24px;
        }

        .status {
            margin-top: 1rem;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .status.error {
            background-color: var(--error-bg);
            color: var(--error-text);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Learner Progress Report</h1>
                <p>Simulating evidence-based proficiency scores</p>
            </div>
            <div style="display: flex; gap: 16px; align-items: center;">
                <button id="authorize_button" class="hidden" style="text-align: center;">Connect Drive</button>
                <a href="setup.html" style="font-size: 0.875rem; color: var(--primary); text-decoration: none; font-weight: 600;">&larr; Back to Setup</a>
            </div>
        </div>

        <div class="card">
            <div class="controls">
                <div id="auth_notice" class="status error hidden" style="margin-top: 0; margin-bottom: 24px;">
                    Please connect Google Drive to load actual goals.
                </div>

                <span class="section-title">Presets & Simulation</span>
                <div class="preset-grid">
                    <button class="sim-btn" onclick="generateReport('typical-5')">Example A</button>
                    <button class="sim-btn" onclick="generateReport('builds-upon')">Example B</button>
                    <button class="sim-btn" onclick="generateReport('variable-speed')">Example C</button>
                    <button class="sim-btn" onclick="generateReport('skewed-8')">Example D</button>
                    <button class="sim-btn secondary" onclick="generateReport('random')">Completely Random</button>
                </div>

                <div id="simulation-stats" class="info-box" style="display: none;">
                    <span class="section-title" style="margin-bottom: 8px;">Simulation Data</span>
                    <div id="stats-content"></div>
                </div>

                <div id="timeline-control" class="info-box" style="display: none;">
                    <span class="section-title" style="margin-bottom: 8px;">Timeline Scrubber</span>
                    <input type="range" id="timeline_scrubber" style="width: 100%; margin-bottom: 8px;" min="0" max="100" value="100">
                    <div id="scrubber_date" style="font-size: 0.875rem; font-weight: 600; text-align: center;"></div>
                </div>

                <div id="loading_status" class="status hidden" style="background: #e0f2fe; color: #0369a1;">
                    Loading goals...
                </div>
            </div>

            <div class="visualization">
                <canvas id="report_canvas" width="800" height="800"></canvas>
            </div>
        </div>
    </div>

    <!-- External scripts -->
    <script src="competency_renderer.js"></script>
    <script src="report.js"></script>

    <script type="module">
        import { createStorageGoogleDrive, createUIPrefsBrowserStorage } from '../js/data.js';

        const CLIENT_ID = '767614918217-040505l01huso2e5f42bavj5magf27p8.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/spreadsheets';

        const uiPrefs = createUIPrefsBrowserStorage();
        const storage = createStorageGoogleDrive(uiPrefs);

        let goals = [];
        let renderer;
        let tokenClient;
        let accessToken = uiPrefs.getAccessToken();
        let currentHoverId = null;
        let currentScores = null;

        // Simulation state
        let allSimulationEvidence = [];
        let simStartTime = 0;
        let simEndTime = 0;
        let currentScrubberType = '';

        function updateDisplay() {
            const authBtn = document.getElementById('authorize_button');
            const authNotice = document.getElementById('auth_notice');
            
            accessToken = uiPrefs.getAccessToken();
            if (accessToken) {
                authBtn.classList.add('hidden');
                authNotice.classList.add('hidden');
            } else {
                authBtn.classList.remove('hidden');
                authNotice.classList.remove('hidden');
            }
        }

        function loadDummyData() {
            goals = [
                { id: '1', name: 'Communication', startLevel: '0', endLevel: '12', position: '0', width: '1.5', color: '#3b82f6' },
                { id: '2', name: 'Critical Thinking', startLevel: '0', endLevel: '12', position: '1.6', width: '1.5', color: '#ef4444' },
                { id: '3', name: 'Collaboration', startLevel: '0', endLevel: '12', position: '3.2', width: '1.5', color: '#10b981' },
                { id: '4', name: 'Creativity', startLevel: '0', endLevel: '12', position: '4.8', width: '1.4', color: '#f59e0b' }
            ];
        }

        async function loadGoals() {
            try {
                const rootData = await storage.readRootData();
                if (rootData && rootData.Competency && rootData.Competency.length > 0) {
                    goals = rootData.Competency.map(c => ({
                        id: c.id,
                        name: c.name,
                        parentId: (c.foundationalIds && c.foundationalIds.length > 0) ? c.foundationalIds[0] : '-1',
                        startLevel: c.startLevel,
                        endLevel: c.endLevel,
                        position: c.rank.toString(),
                        width: c.width,
                        color: c.color || '#94a3b8'
                    }));
                } else {
                    loadDummyData();
                }
            } catch (err) {
                console.error("Error loading competencies:", err);
                loadDummyData();
            }
        }

        function renderCurrent() {
            if (renderer && goals.length > 0) {
                renderer.render(goals, null, currentHoverId, currentScores);
            }
        }

        const addInwardEvidence = (sourceGoal, processedInThisChain, evidence, startTime, oneYear, processedGoals) => {
            processedGoals.forEach(b => {
                if (b.id === sourceGoal.id || processedInThisChain.has(b.id.toString())) return;
                const isInward = sourceGoal.startLevel >= b.endLevel;
                const isContained = sourceGoal.absTheta >= b.absTheta && sourceGoal.absEndTheta <= b.absEndTheta;
                if (isInward && isContained) {
                    evidence.push({ 
                        timestamp: startTime + Math.random() * oneYear, 
                        ratings: [{ id: b.id.toString(), score: 100 }] 
                    });                    processedInThisChain.add(b.id.toString());
                    addInwardEvidence(b, processedInThisChain, evidence, startTime, oneYear, processedGoals);
                }
            });
        };

        function fabricateA(processedGoals, type, startTime) {
            const evidence = [];
            const oneYear = 365 * 24 * 60 * 60 * 1000;
            const simulationTargetLevel = type.includes('5') ? 5 : type.includes('8') ? 8 : 12;

            const goalsWithEvidence = new Set();
            const markInwardGoals = (goal) => {
                processedGoals.forEach(b => {
                    if (b.id === goal.id || goalsWithEvidence.has(b.id.toString())) return;
                    const isInward = goal.startLevel >= b.endLevel;
                    const isContained = goal.absTheta >= b.absTheta && goal.absEndTheta <= b.absEndTheta;
                    if (isInward && isContained) {
                        goalsWithEvidence.add(b.id.toString());
                        markInwardGoals(b);
                    }
                });
            };

            processedGoals.forEach(goal => {
                const goalMid = (goal.startLevel + goal.endLevel) / 2;
                let probability = 0;
                if (goalMid < simulationTargetLevel - 2) probability = 0.9;
                else if (goalMid < simulationTargetLevel + 2) probability = 0.5;
                else probability = 0.1;
                if (type === 'random') probability = 0.5;
                if (Math.random() < probability) {
                    goalsWithEvidence.add(goal.id.toString());
                    markInwardGoals(goal);
                }
            });

            goalsWithEvidence.forEach(goalId => {
                const goal = processedGoals.find(g => g.id.toString() === goalId);
                const goalMid = (goal.startLevel + goal.endLevel) / 2;
                let baseTimestamp;
                if (goalMid >= simulationTargetLevel) {
                    baseTimestamp = startTime + (Math.random() * oneYear);
                } else {
                    const yearsAgo = simulationTargetLevel - Math.floor(goalMid);
                    baseTimestamp = startTime - (yearsAgo * oneYear) + (Math.random() * oneYear);
                }

                const count = Math.floor(Math.random() * 5) + 1;
                for (let i = 0; i < count; i++) {
                    let baseScore = 70;
                    if (type.includes('skewed')) baseScore = Math.random() < 0.5 ? 30 : 95;
                    else baseScore = 60 + Math.random() * 30;
                    const timestamp = baseTimestamp + (Math.random() * (oneYear / 10)) - (oneYear / 20);
                    evidence.push({ 
                        timestamp: timestamp, 
                        ratings: [{ id: goalId, score: Math.round(baseScore) }] 
                    });
                    if (baseScore > 50) {
                        addInwardEvidence(goal, new Set(), evidence, startTime, oneYear, processedGoals);
                    }
                }
            });

            processedGoals.forEach(g => {
                if (!goalsWithEvidence.has(g.id.toString()) && g.startLevel <= simulationTargetLevel) {
                    evidence.push({ 
                        timestamp: startTime + Math.random() * oneYear, 
                        ratings: [{ id: g.id.toString(), score: 0 }] 
                    });                }
            });

            return { evidence, endTime: startTime + oneYear };
        }

        function fabricateDigraph(processedGoals, startTime, speedSelector) {
            const evidence = [];
            const oneDay = 24 * 60 * 60 * 1000;
            const totalDays = 8 * 365;
            
            // Build builds-upon digraph
            const adj = new Map();
            const indegree = new Map();
            const currentIndegree = new Map();
            const goalSpeeds = new Map();

            processedGoals.forEach(g => {
                adj.set(g.id.toString(), []);
                indegree.set(g.id.toString(), 0);
            });

            processedGoals.forEach(i => {
                processedGoals.forEach(j => {
                    if (i.id === j.id) return;
                    const isImmediatelyOutward = Math.abs(i.endLevel - j.startLevel) < 0.01;
                    const overlapStart = Math.max(i.absTheta, j.absTheta);
                    const overlapEnd = Math.min(i.absEndTheta, j.absEndTheta);
                    const hasOverlap = overlapStart < overlapEnd - 0.001;

                    if (isImmediatelyOutward && hasOverlap) {
                        adj.get(i.id.toString()).push(j.id.toString());
                        indegree.set(j.id.toString(), indegree.get(j.id.toString()) + 1);
                    }
                });
            });

            console.log("Builds-upon Digraph:");
            processedGoals.forEach(g => {
                const id = g.id.toString();
                const neighbors = adj.get(id);
                if (neighbors.length > 0 || indegree.get(id) > 0) {
                    console.log(`  ${g.name} (${id}) [in:${indegree.get(id)}] -> ${neighbors.map(nId => processedGoals.find(pg => pg.id.toString() === nId).name).join(', ')}`);
                }
            });

            const frontier = new Map(); // goalId -> currentScore
            processedGoals.forEach(g => {
                const id = g.id.toString();
                currentIndegree.set(id, indegree.get(id));
                if (indegree.get(id) === 0) {
                    frontier.set(id, 0);
                    goalSpeeds.set(id, speedSelector(id));
                }
            });

            for (let d = 0; d < totalDays; d++) {
                if (frontier.size === 0) break;
                
                const currentTime = startTime + d * oneDay;
                const keys = Array.from(frontier.keys());
                const goalId = keys[Math.floor(Math.random() * keys.length)];
                let score = frontier.get(goalId);
                const speed = goalSpeeds.get(goalId);
                
                evidence.push({
                    timestamp: currentTime,
                    ratings: [{ id: goalId, score: Math.round(score) }]
                });

                const increment = (100 * frontier.size * speed) / 365;
                score = Math.min(100, score + increment);
                
                if (score >= 100) {
                    frontier.delete(goalId);
                    const successors = adj.get(goalId);
                    successors.forEach(sId => {
                        const remaining = currentIndegree.get(sId) - 1;
                        currentIndegree.set(sId, remaining);
                        if (remaining === 0) {
                            frontier.set(sId, 0);
                            goalSpeeds.set(sId, speedSelector(sId));
                        }
                    });
                } else {
                    frontier.set(goalId, score);
                }
            }

            return { evidence, endTime: startTime + totalDays * oneDay };
        }

        function fabricateB(processedGoals, startTime) {
            return fabricateDigraph(processedGoals, startTime, () => 1.0);
        }

        function fabricateC(processedGoals, startTime) {
            return fabricateDigraph(processedGoals, startTime, () => {
                const r = Math.random();
                if (r < 0.33) return 0.5;
                if (r < 0.66) return 1.0;
                return 1.5;
            });
        }

        function generateReport(type) {
            if (goals.length === 0) return;

            const goalMap = new Map();
            goals.forEach(g => goalMap.set(g.id.toString(), g));

            const getAbsTheta = (g) => {
                let theta = parseFloat(g.position) || 0;
                let current = g;
                while (current.parentId && current.parentId !== '-1') {
                    const parent = goalMap.get(current.parentId.toString());
                    if (!parent) break;
                    theta += parseFloat(parent.position) || 0;
                    current = parent;
                }
                return theta;
            };

            const processedGoals = goals.map(g => {
                const absTheta = getAbsTheta(g);
                const width = parseFloat(g.width) || 0;
                return {
                    ...g,
                    absTheta: absTheta,
                    absEndTheta: absTheta + width,
                    startLevel: parseFloat(g.startLevel) || 0,
                    endLevel: parseFloat(g.endLevel) || 0
                };
            });

            const startTime = Date.now();
            let result;
            
            if (type === 'builds-upon') {
                result = fabricateB(processedGoals, startTime);
            } else if (type === 'variable-speed') {
                result = fabricateC(processedGoals, startTime);
            } else {
                result = fabricateA(processedGoals, type, startTime);
            }

            const evidence = result.evidence;
            const endTime = result.endTime;

            // Store state for scrubber
            allSimulationEvidence = evidence;
            simStartTime = startTime;
            simEndTime = endTime;
            currentScrubberType = type;

            // Find true bounds of evidence
            let minEv = startTime;
            let maxEv = endTime;
            evidence.forEach(ev => {
                const t = new Date(ev.timestamp).getTime();
                if (t < minEv) minEv = t;
                if (t > maxEv) maxEv = t;
            });

            const scrubber = document.getElementById('timeline_scrubber');
            scrubber.min = minEv;
            scrubber.max = maxEv;
            scrubber.value = maxEv;
            
            document.getElementById('timeline-control').style.display = 'block';
            updateFromScrubber();
        }

        function updateFromScrubber() {
            const scrubber = document.getElementById('timeline_scrubber');
            const scrubberDate = parseInt(scrubber.value);
            document.getElementById('scrubber_date').innerText = new Date(scrubberDate).toLocaleDateString();

            const threeMonths = 3 * 30 * 24 * 60 * 60 * 1000;
            const startTime = scrubberDate - threeMonths;
            currentScores = calculateGoalScores(goals, allSimulationEvidence, startTime, scrubberDate);
            
            document.getElementById('simulation-stats').style.display = 'block';
            document.getElementById('stats-content').innerHTML = `
                <div style="margin-bottom: 4px;"><strong>Preset:</strong> ${currentScrubberType}</div>
                <div style="margin-bottom: 4px;"><strong>Total evidence:</strong> ${allSimulationEvidence.length}</div>
                <div style="margin-bottom: 4px;"><strong>Active evidence:</strong> ${allSimulationEvidence.filter(e => new Date(e.timestamp).getTime() <= scrubberDate).length}</div>
                <div style="margin-bottom: 4px;"><strong>Goals with scores:</strong> ${Object.keys(currentScores).length}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 8px;">
                    View Date: ${new Date(scrubberDate).toLocaleDateString()}
                </div>
            `;
            renderCurrent();
        }

        async function initProject() {
            document.getElementById('loading_status').classList.remove('hidden');
            await loadGoals();
            document.getElementById('loading_status').classList.add('hidden');
            generateReport('typical-5');
        }

        function gisLoaded() {
            tokenClient = uiPrefs.initTokenClient(google.accounts.oauth2, {
                clientId: CLIENT_ID,
                scope: SCOPES,
                callback: (resp) => {
                    if (resp.error) {
                        updateDisplay();
                        return;
                    }
                    updateDisplay();
                    initProject();
                },
            });
            
            const userEmail = uiPrefs.getUserEmail();
            if (uiPrefs.getAccessToken()) {
                initProject();
            } else if (userEmail) {
                uiPrefs.requestAccessToken(tokenClient, { interactive: false });
            } else {
                updateDisplay();
            }
        }
        window.gisLoaded = gisLoaded;

        // DOM Setup
        document.addEventListener('DOMContentLoaded', () => {
            renderer = new CompetencyRenderer(document.getElementById('report_canvas'));
            const canvas = document.getElementById('report_canvas');
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (canvas.height / rect.height);
                const id = renderer.getGoalAt(x, y);
                if (id !== currentHoverId) {
                    currentHoverId = id;
                    renderCurrent();
                }
            };
            canvas.onmouseleave = () => {
                currentHoverId = null;
                renderCurrent();
            };
            document.getElementById('authorize_button').onclick = () => {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            };
            document.getElementById('timeline_scrubber').oninput = updateFromScrubber;
            if (!accessToken) loadDummyData();
            updateDisplay();
        });
    </script>

    <!-- Load GIS script -->
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
